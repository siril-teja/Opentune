# Every pull request: unit tests, lint, and a shrunk release build, so a change
# that breaks any of them shows up before it reaches main.
name: CI

on:
  pull_request:
  # Or by hand, from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 (InnerTubeX's AAR is built against it) and the build
      # tools. The packages are named because the action's default list
      # includes "tools", which the current SDK manager no longer has.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      # Once, on the standard edition: the personal one is the same code. The
      # release build is what R8 shrinking can break.
      - name: Unit tests, lint and release build
        run: ./gradlew --no-daemon testStandardDebugUnitTest lintStandardDebug assembleStandardRelease

      - name: Test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
