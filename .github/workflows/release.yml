# When main has a versionName (in app/build.gradle.kts) that has no release
# yet, builds both editions, signed, and publishes them as a GitHub release:
# bump the version, merge to main, and the release follows.
#
# Repository secrets it needs:
#   OPENTUNE_KEYSTORE_BASE64   the signing keystore, base64-encoded
#   OPENTUNE_KEYSTORE_PASSWORD
#   OPENTUNE_KEY_ALIAS
#   OPENTUNE_KEY_PASSWORD
#   OPENTUNE_PERSONAL_SECRET   the personal edition's Secret (see AppLock)
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Which release this is, and whether it's out already.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      # Both editions, signed with the release key; the tests already ran on the pull request.
      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENTUNE_KEYSTORE_BASE64 }}
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
          OPENTUNE_KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
          OPENTUNE_PERSONAL_SECRET: ${{ secrets.OPENTUNE_PERSONAL_SECRET }}
        run: |
          # Signed with any other key, an update wouldn't install over the app; without
          # the Secret, the personal edition would go out unlocked.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$OPENTUNE_PERSONAL_SECRET" ]; then
            echo "::error::Set the OPENTUNE_KEYSTORE_* and OPENTUNE_PERSONAL_SECRET repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          export OPENTUNE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/release.keystore"

      # Each edition updates itself to the file named by its UPDATE_ASSET
      # (app/build.gradle.kts); builds up to v0.4.25 look for -arm64-v8a.apk.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/personal/release/app-personal-release.apk "dist/OpenTune-${TAG}-personal-arm64-v8a.apk"
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/OpenTune-${TAG}-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "OpenTune $TAG" --generate-notes \
            --notes "\`OpenTune-${TAG}-universal.apk\`: standard edition, for any phone. \`OpenTune-${TAG}-personal-arm64-v8a.apk\`: personal edition."
