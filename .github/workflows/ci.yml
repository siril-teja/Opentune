# Every push and pull request: build, unit tests, lint, and the shrunk
# release APKs, so a change that breaks any of them shows up here first.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  # Or by hand, from the Actions tab.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 (InnerTubeX's AAR is built against it) and the build
      # tools. The packages are named because the action's default list
      # includes "tools", which the current SDK manager no longer has.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, unit tests and lint
        # Tests and lint once, on the standard edition: the personal one is the same code.
        run: ./gradlew --no-daemon assembleDebug testStandardDebugUnitTest lintStandardDebug

      - name: Release build (R8 shrinking)
        run: ./gradlew --no-daemon assembleRelease

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/screenshots/
          if-no-files-found: ignore

      - name: APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          # Only the standard edition: these builds have no Secret, and anyone can download them.
          path: app/build/outputs/apk/standard/release/*.apk
