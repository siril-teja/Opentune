# Builds signed release APKs and attaches them to a GitHub release, either
# when a tag like v0.2.0 is pushed, or when main has a versionName (in
# app/build.gradle.kts) that has no release yet: bump the version, merge to
# main, and the release follows.
#
# Signing uses these repository secrets when they're set:
#   OPENTUNE_KEYSTORE_BASE64   the keystore file, base64-encoded
#   OPENTUNE_KEYSTORE_PASSWORD
#   OPENTUNE_KEY_ALIAS
#   OPENTUNE_KEY_PASSWORD
# Without them the APKs are signed with the runner's throwaway debug key:
# they install, but each release would then need uninstalling the last.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Which release this is, and whether it already exists (then the rest is skipped).
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk 37 (InnerTubeX's AAR is built against it) and the build
      # tools. The packages are named because the action's default list
      # includes "tools", which the current SDK manager no longer has.
      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.skip != 'true'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Keystore
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENTUNE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "OPENTUNE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No release key set; signing with the debug key."
          fi

      - name: Build
        if: steps.version.outputs.skip != 'true'
        env:
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
          OPENTUNE_KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
          # The personal edition's Secret (see AppLock); only its hash goes in the APK.
          OPENTUNE_PERSONAL_SECRET: ${{ secrets.OPENTUNE_PERSONAL_SECRET }}
        # The tests already ran on the pull request that brought this to main.
        run: |
          if [ -z "$OPENTUNE_PERSONAL_SECRET" ]; then
            echo "::error::Add the OPENTUNE_PERSONAL_SECRET repository secret: the personal edition isn't released without its lock."
            exit 1
          fi
          ./gradlew --no-daemon assembleRelease

      - name: Name the APKs
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Each edition updates itself to the file named by its UPDATE_ASSET
          # (app/build.gradle.kts); builds up to v0.4.25 look for -arm64-v8a.apk.
          mkdir dist
          cp app/build/outputs/apk/personal/release/app-personal-release.apk "dist/OpenTune-${TAG}-personal-arm64-v8a.apk"
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/OpenTune-${TAG}-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # From main this also creates the tag, on the commit that was built.
        run: |
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "OpenTune $TAG" --generate-notes --notes "**Which file?** \`OpenTune-${TAG}-universal.apk\` is the standard edition, for any phone. \`OpenTune-${TAG}-personal-arm64-v8a.apk\` is Tej's personal edition."
